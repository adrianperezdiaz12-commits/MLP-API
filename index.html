<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little Pony Characters</title>
</head>
<body>
    <h1>My Little Pony Characters</h1>

    <p id="status">Loading characters...</p>
    <ul id="characterList"></ul>

    <script>
        const characterList = document.getElementById("characterList");
        const status = document.getElementById("status");
        const url = "https://ponyapi.net/v1/character/all?limit=12&kind=name&image=url";

        async function fetchCharacters() {
            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Request failed: ${response.status}`);
                }

                const result = await response.json();

                if (result.status !== 200) {
                    throw new Error(result.error || "Could not load characters");
                }

                if (result.data.length === 0) {
                    status.textContent = "No characters found.";
                    return;
                }

                status.textContent = "";

                result.data.forEach(character => {
                    const listItem = document.createElement("li");

                    const name = document.createElement("h2");
                    name.textContent = character.name;
                    listItem.appendChild(name);

                    if (character.kind && character.kind.length > 0) {
                        const kind = document.createElement("p");
                        kind.textContent = `Kind: ${character.kind.join(", ")}`;
                        listItem.appendChild(kind);
                    }

                    if (character.image && character.image.length > 0) {
                        const image = document.createElement("img");
                        image.src = character.image[0];
                        image.alt = character.name;
                        image.width = 200;
                        listItem.appendChild(image);
                    }

                    if (character.url) {
                        const link = document.createElement("p");
                        const fandomLink = document.createElement("a");
                        fandomLink.href = character.url;
                        fandomLink.target = "_blank";
                        fandomLink.textContent = "View character details";
                        link.appendChild(fandomLink);
                        listItem.appendChild(link);
                    }

                    characterList.appendChild(listItem);
                });

                console.log(result);
            } catch (error) {
                console.error(error);
                status.textContent = `Could not load characters: ${error.message}`;
            }
        }

        fetchCharacters();
    </script>
</body>
</html>
